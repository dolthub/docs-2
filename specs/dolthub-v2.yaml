              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createTag
      summary: Create a tag.
      description: >-
        Creates a new tag in `{owner}/{database}` pointing at the source revision named by
        `from`. The optional `message` makes the tag annotated; omitted yields a lightweight
        tag. Returns the new `Tag` resource on `201`. Authentication required; the caller
        must have write access. A `409 Conflict` comes back if a tag with the same name
        already exists.
      tags:
        - Database
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      requestBody:
