              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createRelease
      summary: Create a release.
      description: >-
        Creates a release in `{owner}/{database}` pinned to the commit named by `commit_sha`
        and published under `tag`. When `create_tag_if_not_exists` is true and no tag with
        that name exists, the backend creates one pointing at the same commit; otherwise the
        tag must already exist and point at the same commit. Returns the new `Release`
        resource on `201`. Authentication required; the caller must have write access. A
        `409 Conflict` comes back if a release with the same tag already exists.
      tags:
        - Database
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          description: The newly-created release.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response. Reuse the inbound
                `x-request-id` from the caller / edge proxy when present; otherwise the
                server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/sql:
    get:
      operationId: runSqlReadQuery
      summary: Run a read-only SQL query.
      description: >-
        Executes a read-only SQL query against the database at the given revision and returns
        the result rows, the column schema, and the query-execution status. Read queries are
        not paginated — the full row set comes back in one response, bounded by `limit`
        (default 1000) and the server-enforced row cap. For larger result sets, refine the
        query (`LIMIT`/`WHERE`/`SELECT` fewer columns).

        SQL-level errors (syntax errors, missing tables, timeouts, row-limit exceeded) come
        back as `200` with `status: "error" | "timeout" | "row_limit" | "not_workspace"` and a
        human-readable `message` — they are query-level conditions, not transport-level
        failures. HTTP `4xx` / `5xx` are reserved for transport-level problems (auth, the
        database doesn't exist, malformed request).

        Public databases are readable without authentication; private databases require a
        credential with access (and return `404` otherwise, so their existence isn't leaked).
      tags:
        - Database
      security:
        - {}
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
        - name: ref
          in: query
          required: true
          description: >-
            The branch, tag, or commit hash to query against. A 32-character value using only
            the characters `0-9a-v` (Dolt's base32 alphabet) is treated as a commit hash;
            everything else resolves as a branch, tag, or other ref.
          schema:
            type: string
            minLength: 1
          example: main
        - name: q
          in: query
          required: true
          description: The SQL query to execute. Read-only — use `POST /sql-writes` for mutations.
          schema:
            type: string
            minLength: 1
          example: "SELECT name, year FROM jails LIMIT 10"
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of rows to return (default `1000`). The server enforces an upper
            cap; refine the query for larger result sets.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
          example: "100"
        - name: timeout_ms
          in: query
          required: false
          description: >-
            Per-query execution timeout in milliseconds (default `30000`, server-enforced
            cap `60000`). A query that hits the cap returns `status: "timeout"`.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
          example: "10000"
      responses:
        "200":
          description: The query result. SQL-level errors live in `status` + `message`.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: runSqlReadQueryPost
      summary: Run a SQL read query (body-encoded).
      description: >-
        Body-encoded read variant of `GET /sql` — identical semantics and response shape,
        but the query is carried in the body to dodge the browser/proxy URL-length limit
        (~4–8 KB) that `?q=` hits for large SQL statements. Reads follow the
        database-level convention: public databases are readable without a token, private
        databases require one. Writes go to `POST /sql-writes`, not here.
      tags:
        - Database
      security:
        - {}
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlReadRequest"
      responses:
        "200":
          description: The read query result. SQL-level errors live in `status` + `message`.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/sql-writes:
    post:
      operationId: runSqlWriteQuery
      summary: Run an asynchronous SQL write.
      description: >-
        Kicks off an asynchronous SQL write. Runs `query` on `to_branch` (creating it from
        `from_branch` if it doesn't exist), then merges `from_branch` into `to_branch`.
        Returns `202` with an `OperationRef`; follow `OperationRef.href` to
        `GET /api/v2/operations/{id}` and poll until `status` is `succeeded` or `failed`.
        Authentication is required.
      tags:
        - Database
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlWriteRequest"
      responses:
        "202":
          description: The write operation has been accepted and is queued.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response. Reuse the inbound
                `x-request-id` from the caller / edge proxy when present; otherwise the
                server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/pulls:
    get:
      operationId: listPulls
      summary: List pull requests.
      description: >-
        Returns the pull requests for the database `{owner}/{database}`, ordered by the backend.
        Cursor-paginated via `page_token` (request) / `meta.next_page_token` (response); when
        `next_page_token` is absent or empty there are no further pages. Public databases are
        readable without authentication; private databases require a credential with access
        (and return `404` otherwise, so their existence isn't leaked).
      tags:
        - Database
      security:
        - {}
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
