# DoltHub Public API v2 — OpenAPI contract.
#
# This is the single source of truth for the v2 API. TypeScript DTO types,
# runtime/contract-test JSON Schemas, and the public docs are all generated
# from this file — never hand-edited downstream.
openapi: 3.1.0

info:
  title: DoltHub API
  version: 2.0.0
  summary: The public REST API for DoltHub databases, branches, commits, and SQL.
  description: |
    The DoltHub v2 API is an explicit, versioned, OpenAPI-defined contract. Unlike the
    legacy `v1alpha1` API it replaces, v2 commits to consistent HTTP semantics, a single
    error model (RFC 9457 problem details), a uniform success envelope, and a standardized
    protocol for long-running operations.

    This document is the contract: it is the source of truth for the implementation, the
    generated client types, and the rendered reference docs. See the stability policy for
    what "v2" guarantees and how changes are versioned.
  contact:
    name: DoltHub Support
    url: https://www.dolthub.com/contact
    email: dolt-interest@dolthub.com
  license:
    name: DoltHub Terms of Service
    url: https://www.dolthub.com/terms
  termsOfService: https://www.dolthub.com/terms

servers:
  - url: https://www.dolthub.com
    description: Production

# Default: every operation requires one of the supported credential types. Individual
# operations may override this (e.g. public reads) once paths are added.
security:
  - personalAccessToken: []
  - oauth2: [api_read_write]

# Operation tags are registered here so renderers (Scalar) group operations consistently.
tags:
  - name: Database
    description: DoltHub databases and their metadata.
  - name: User
    description: The authenticated user.
  - name: Operations
    description: Long-running async operations. Every async mutation returns an OperationRef; poll this resource to track progress.

paths:
  /api/v2/user:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user.
      description: Returns the profile of the user identified by the request's credentials.
      tags:
        - User
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      responses:
        "200":
          description: The authenticated user's profile.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases:
    post:
      operationId: createDatabase
      summary: Create a database.
      description: >-
        Creates a database under the named owner (a user or organization). The caller's
        credentials must allow creating under that owner — creating for yourself works as
        long as you authenticate; creating for an organization requires membership with the
        appropriate role. Returns the new `Database` resource on `201`. If a database with
        the same `{owner, name}` already exists, the response is `409 Conflict`.
      tags:
        - Database
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDatabaseRequest"
      responses:
        "201":
          description: The newly-created database.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response. Reuse the inbound
                `x-request-id` from the caller / edge proxy when present; otherwise the
                server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}:
    get:
      operationId: getDatabase
      summary: Get a database.
      description: >-
        Returns the metadata for the database `{owner}/{database}`. Public databases are readable
        without authentication; private databases require a credential with access (and return
        `404` otherwise, so their existence isn't leaked).
      tags:
        - Database
      # Optional auth: anonymous callers may read public databases; a token, when supplied, is
      # honored for private access. The empty `{}` marks authentication as optional.
      security:
        - {}
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      responses:
        "200":
          description: The database's metadata.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/branches:
    get:
      operationId: listBranches
      summary: List branches.
      description: >-
        Returns the branches of the database `{owner}/{database}`, ordered by the backend.
        Cursor-paginated via `page_token` (request) / `meta.next_page_token` (response); when
        `next_page_token` is absent or empty there are no further pages. Public databases are
        readable without authentication; private databases require a credential with access (and
        return `404` otherwise, so their existence isn't leaked).
      tags:
        - Database
      # Optional auth: anonymous callers may read public databases; a token, when supplied, is
      # honored for private access. The empty `{}` marks authentication as optional.
      security:
        - {}
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
          example: us-jails
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: The database's branches.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createBranch
      summary: Create a branch.
      description: >-
        Creates a new branch in `{owner}/{database}` pointing at the source revision named
        by `from`. Authentication required; the caller must have write access. Returns the
        new `Branch` resource on `201`. A `409 Conflict` comes back if a branch with the
        same name already exists.
      tags:
        - Database
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: The newly-created branch.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response. Reuse the inbound
                `x-request-id` from the caller / edge proxy when present; otherwise the
                server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/tags:
    get:
      operationId: listTags
      summary: List tags.
      description: >-
        Returns the tags of the database `{owner}/{database}`, ordered by the backend.
        Cursor-paginated via `page_token` (request) / `meta.next_page_token` (response); when
        `next_page_token` is absent or empty there are no further pages. Public databases are
        readable without authentication; private databases require a credential with access (and
        return `404` otherwise, so their existence isn't leaked).
      tags:
        - Database
      # Optional auth: anonymous callers may read public databases; a token, when supplied, is
      # honored for private access. The empty `{}` marks authentication as optional.
