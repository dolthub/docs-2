                        $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/forks:
    get:
      operationId: listForks
      summary: List forks.
      description: >-
        Returns the databases that have been directly forked from `{owner}/{database}` —
        immediate children only. Forks-of-forks are not flattened into the list; use
        `fork_network_count` on the `Database` resource for the transitive total. Topology
        context (`parent`, `network_root`, total `fork_network_count`) lives on the `Database`
        resource. Pagination (`page_token` / `meta.next_page_token`) will be added when the
        backend supports it; until then the full list is returned in one response. Public
        databases are readable without authentication; private databases require a credential
        with access (and return `404` otherwise, so their existence isn't leaked).
      tags:
        - Database
      # Optional auth: anonymous callers may read public databases; a token, when supplied, is
      # honored for private access. The empty `{}` marks authentication as optional.
      security:
        - {}
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      responses:
        "200":
          description: The database's direct fork children (immediate forks only).
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response (including 2xx). Reuse
                the inbound `x-request-id` from the caller / edge proxy when present;
                otherwise the server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DatabaseRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createFork
      summary: Fork a database.
      description: >-
        Forks `{owner}/{database}` into `owner`'s namespace. Returns `202` with an
        `OperationRef`; follow `OperationRef.href` to poll for completion (operation IDs
        contain slashes and must not be interpolated raw into path templates). The caller
        must have read access on the source database and may only fork into a namespace
        they own. Duplicate forks (same source forked twice into the same owner) surface
        as `422` via the standard error model. Authentication is required.
      tags:
        - Database
      security:
        - personalAccessToken: []
        - oauth2: [api_read_write]
      parameters:
        - name: owner
          in: path
          required: true
          description: The user or organization that owns the source database.
          schema:
            type: string
            minLength: 1
          example: dolthub
        - name: database
          in: path
          required: true
          description: The source database name, unique within the owner.
          schema:
            type: string
            minLength: 1
          example: us-jails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForkRequest"
      responses:
        "202":
          description: The fork operation has been accepted and is queued.
          headers:
            x-request-id:
              description: >-
                The request identifier — echoed on every response. Reuse the inbound
                `x-request-id` from the caller / edge proxy when present; otherwise the
                server mints a `req_<UUID>` value.
              schema:
                type: string
                examples:
                  - req_2f1c9e7a-3b6d-4c5e-8a9f-0d1e2f3a4b5c
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/OperationRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/databases/{owner}/{database}/releases:
    get:
      operationId: listReleases
      summary: List releases.
      description: >-
        Returns the releases of the database `{owner}/{database}`, ordered by the backend.
