name: Cypress docs tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cypress-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run compile

  cypress-dolt:
    name: Cypress (dolt)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Cypress dependencies
        run: npm ci
      - name: Install Astro site dependencies
        run: cd site/dolt && npm install --legacy-peer-deps
      - name: Build Astro site
        run: cd site/dolt && npm run build
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          start: npm run preview:dolt
          wait-on: "http://localhost:4321"
          wait-on-timeout: 30
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-dolt
          path: cypress/screenshots
          retention-days: 7

  cypress-doltlab:
    name: Cypress (doltlab)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Cypress tests against live site
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config-file: cypress.doltlab.config.ts
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-doltlab
          path: cypress/screenshots
          retention-days: 7

  cypress-doltgres:
    name: Cypress (doltgres)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Cypress tests against live site
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config-file: cypress.doltgres.config.ts
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-doltgres
          path: cypress/screenshots
          retention-days: 7
